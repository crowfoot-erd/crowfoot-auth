# 로컬 개발 — 접속 정보·네트워크 상태는 00-environment/redis-connection.md 참조.
spring:
  config:
    import: "optional:file:.env-local[.properties]"   # 로컬 시크릿(gitignore) — 존재하지 않으면 무시
  data:
    redis:
      host: s4.java21.net
      port: 6379
      password: ${CROWFOOT_REDIS_PASSWORD}
      database: ${CROWFOOT_REDIS_DATABASE:400}
  cloud:
    discovery:
      client:
        simple:
          instances:
            # FeignClient("crowfoot-core-api")가 여기를 본다 (api-design.md Section 11)
            crowfoot-core-api[0]:
              uri: http://localhost:8082
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000       # 재시도 없음(기본 NEVER_RETRY)
crowfoot:
  auth:
    # 브라우저가 보는 프론트(Vite 8080) — 콜백 주소·redirect_uri 조립 기점
    front:
      origin: http://localhost:8080
      callback-path: /auth/callback
    cookie:
      secure: false                  # 로컬 http — prod는 true
    blacklist:
      store: redis
logging:
  level:
    net.java21.crowfoot.auth: DEBUG

server:
  port: 8081   # 로컬 개발 — 프로세스별 포트 분리(운영은 전부 8080)
